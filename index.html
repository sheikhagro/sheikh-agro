<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শেখ এগ্রো - খাঁটি পণ্যের সমাহার</title>
    <!-- Tailwind CSS (ডিজাইনের জন্য) এবং jQuery CDN -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jquery.com"></script>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f7fafc; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- হেডার ও নেভিগেশন বার -->
    <header class="bg-green-600 text-white p-4 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold">শেখ এগ্রো ফার্ম লিমিটেড</h1>
        <!-- অ্যাডমিন বাটন -->
        <button id="adminBtn" class="bg-white text-green-600 px-4 py-2 rounded-full font-semibold shadow hover:bg-green-100 transition">
            অ্যাডমিন প্যানেল
        </button>
    </header>

    <!-- মূল ওয়েবসাইট কন্টেন্ট (ভিজিটরদের জন্য) -->
    <main class="container mx-auto p-6 text-center">
        <h2 class="text-2xl font-semibold text-gray-800 my-4">আমাদের প্রিমিয়াম পণ্যসমূহ</h2>
        <p class="text-gray-600">খাঁটি চাল, মধু এবং কৃষি পণ্য সরাসরি খামার থেকে আপনার দুয়ারে।</p>
        
        <!-- প্রোডাক্ট ডিসপ্লে গ্রিড -->
        <div id="productContainer" class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-6">
            <!-- ফায়ারবেস থেকে প্রোডাক্ট লোড হয়ে এখানে আসবে -->
            <div class="bg-white p-4 rounded-lg shadow text-center">
                <p class="text-gray-500">পণ্য লোড হচ্ছে...</p>
            </div>
        </div>
    </main>

    <!-- অ্যাডমিন সেকশন (পিন কোড সফল হলে এটি ওপেন হবে) -->
    <div id="adminPage" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-lg shadow-lg text-center max-w-sm w-full">
            <h3 class="text-lg font-bold text-gray-800 mb-4">অ্যাডমিন অ্যাক্সেস ভেরিফাইড</h3>
            <p class="text-gray-600 mb-6">পণ্য ব্যবস্থাপনার জন্য নিচের বাটনে ক্লিক করে মূল ফর্মে প্রবেশ করুন।</p>
            <a href="admin.html" class="bg-green-600 text-white px-6 py-2 rounded shadow hover:bg-green-700 block text-center font-medium">
                পণ্য আপলোড ফর্মে যান
            </a>
        </div>
    </div>

    <!-- জাভাস্ক্রিপ্ট লজিক এবং পিন কোড সিকিউরিটি -->
    <script>
        $(document).ready(function() {
            // অ্যাডমিন বাটনে ক্লিক করলে পিন কোড চাবে
            $("#adminBtn").on("click", function() {
                // পিন প্রম্পট বক্স
                let pass = prompt("(পাইলট এডমিন PIN লিখুন) (DEMO PIN: 2468)");
                
                // পিন কোড চেক (অবশ্যই ইংরেজি কিবোর্ডে ২৪৬৮ টাইপ করতে হবে)
                if (pass === "2468") {
                    // পিন সঠিক হলে অ্যাডমিন সেকশন দেখাবে
                    $("#adminPage").removeClass("hidden");
                } else if (pass !== null) {
                    // পিন ভুল হলে অ্যালার্ট দেখাবে
                    alert("পিন ভুল হয়েছে! অনুগ্রহ করে ইংরেজি কিবোর্ড ব্যবহার করুন।");
                }
            });

            // ব্যাকড্রপ বা পপআপ বন্ধ করার জন্য স্ক্রিনের বাইরে ক্লিক করলে হাইড হবে (ঐচ্ছিক)
            $("#adminPage").on("click", function(e) {
                if (e.target === this) {
                    $(this).addClass("hidden");
                }
            });
        });
    </script>

</body>
</html>
